    // Calculate road mileage estimate from 16848 E Gunnison Dr (39.68784, -104.79194)
    function getMilesFromGunnison(lat, lng) {
      if (typeof lat !== 'number' || typeof lng !== 'number') return null;
      const R = 3958.8;
      const dLat = (lat - HOME_LOCATION.lat) * Math.PI / 180;
      const dLon = (lng - HOME_LOCATION.lng) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(HOME_LOCATION.lat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const straightMiles = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return parseFloat((straightMiles * 1.2).toFixed(1));
    }

    /**
     * APPLE MAPS DIRECTIONS URL BUILDER
     * Uses ONLY `daddr` (Destination Address) and omits `saddr`.
     * When `saddr` is omitted, Apple Maps automatically uses your iPhone's live "My Location"
     * instead of dropping a fake starting pin on E Alameda Dr!
     */
    function getDirectionsUrl(meeting) {
      if (meeting.format === 'Online' || !meeting.lat || !meeting.lng) {
        return meeting.zoomUrl || 'https://coloradocma.org/meetings/';
      }
      return `https://maps.apple.com/?daddr=${encodeURIComponent(meeting.address)}&dirflg=d`;
    }

    function getFilteredMeetings() {
      const todayName = DAYS[new Date().getDay()];
      const targetDay = state.selectedDay === 'Today' ? todayName : state.selectedDay;

      const list = MEETINGS_DATA.filter(m => {
        if (state.selectedDay === 'All') return true;
        return m.day === targetDay;
      });

      list.forEach(m => {
        m.miles = getMilesFromGunnison(m.lat, m.lng);
      });

      // Sort nearest to 16848 E Gunnison Dr first
      list.sort((a, b) => {
        const distA = a.miles !== null ? a.miles : 9999;
        const distB = b.miles !== null ? b.miles : 9999;
        if (distA !== distB) return distA - distB;
        return a.timeSort - b.timeSort;
      });

      return list;
    }

    // ==================== RENDER DAY PILLS ====================
    function renderDayPills() {
      const container = document.getElementById('day-pills-container');
      const todayName = DAYS[new Date().getDay()];
      const pills = ['Today', 'All', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

      container.innerHTML = pills.map(day => {
        const isActive = state.selectedDay === day;
        let label = day === 'Today' ? `Today (${todayName.slice(0, 3)})` : day === 'All' ? 'All Days' : day.slice(0, 3);

        return `
          <button data-day="${day}" class="day-pill px-3 py-1 rounded-lg text-xs font-bold transition ${
            isActive
              ? 'bg-cyan-500 text-slate-950 shadow-sm'
              : 'bg-slate-800/90 text-slate-300 hover:bg-slate-700 border border-slate-700/60'
          }">
            ${label}
          </button>
        `;
      }).join('');

      container.querySelectorAll('.day-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDay = btn.getAttribute('data-day');
          renderDayPills();
          renderMeetingsList();
          updateMapMarkers();
        });
      });
    }

        return `

              <div class="text-[10px] font-bold ${isToday ? 'text-amber-400' : 'text-cyan-400'} uppercase tracking-wide mt-0.5">
                ${m.day.slice(0, 3)}
              </div>
              ${m.miles !== null ? `

                <span class="shrink-0 text-[9px] font-bold px-1.5 py-0.2 rounded ${

                    ? 'bg-purple-950 text-purple-300 border border-purple-700/40'

                    : 'bg-emerald-950 text-emerald-300 border border-emerald-700/40'

              </div>

                ${m.address}
              </div>
            </div>

            <!-- Right Column: Quick Map Pin & Direct Apple Maps Button -->
            <div class="shrink-0 flex items-center space-x-1.5">
              ${!isOnline ? `
                <button type="button" onclick="focusOnMap('${m.id}')" title="Show on Map"
                  class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-400 border border-slate-700 flex items-center justify-center transition">
                  <i class="ph-bold ph-map-pin text-sm"></i>
                </button>
              ` : ''}

              <a href="${dirUrl}" target="_blank" rel="noopener noreferrer"
                class="px-2.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1 shadow active:scale-95 transition ${
                  isOnline
                    ? 'bg-purple-600 hover:bg-purple-500 text-white'
                    : 'bg-cyan-600 hover:bg-cyan-500 text-white'
                }">
                <i class="ph-bold ${isOnline ? 'ph-video-camera' : 'ph-navigation-arrow'} text-xs"></i>
                <span>${isOnline ? 'Zoom' : 'Go'}</span>
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    // ==================== MAP VIEW LOGIC ====================
    function initMap() {
      if (map) return;

      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([HOME_LOCATION.lat, HOME_LOCATION.lng], 11);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      renderHomePin();
      updateMapMarkers();
    }

    function renderHomePin() {
      if (!map) return;
      if (homeMarker) map.removeLayer(homeMarker);

      const homeIcon = L.divIcon({
        className: 'home-pin-wrapper',
        html: `
          <div class="pulse-ring"></div>
          <div class="home-badge-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="#ffffff" viewBox="0 0 256 256"><path d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H48V115.55l80-75.48,80,75.48Z"></path></svg>
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });

      homeMarker = L.marker([HOME_LOCATION.lat, HOME_LOCATION.lng], {
        icon: homeIcon,
        zIndexOffset: 1000
      }).addTo(map);

      homeMarker.bindPopup(`
        <div class="p-1 min-w-[175px]">
          <div class="text-[10px] font-extrabold uppercase tracking-wider text-sky-400">Your Home Center</div>
          <div class="font-bold text-white text-xs mt-0.5">${HOME_LOCATION.address}</div>
          <div class="text-[10px] text-slate-400 mt-0.5">${HOME_LOCATION.lat}, ${HOME_LOCATION.lng}</div>
        </div>
      `);
    }

    function updateMapMarkers() {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();
      Object.keys(markerMap).forEach(k => delete markerMap[k]);

      // In Map View, if 'Today' is selected, we still show all physical meetings or filtered day meetings
      const listToShow = state.selectedDay === 'Today' ? MEETINGS_DATA : getFilteredMeetings();
      const todayName = DAYS[new Date().getDay()];
      const coordCount = {};

      listToShow.forEach(m => {
        if (!m.lat || !m.lng) return;

        const miles = getMilesFromGunnison(m.lat, m.lng);
        const dirUrl = getDirectionsUrl(m);

        // Slight offset for meetings sharing the exact same church building
        const key = `${m.lat.toFixed(4)}_${m.lng.toFixed(4)}`;
        coordCount[key] = (coordCount[key] || 0) + 1;
        const idx = coordCount[key] - 1;
        const angle = idx * 2.1;
        const latOffset = idx > 0 ? Math.cos(angle) * 0.0011 : 0;
        const lngOffset = idx > 0 ? Math.sin(angle) * 0.0014 : 0;

        const isToday = m.day === todayName;
        const bgColor = isToday ? '#f59e0b' : m.format === 'Hybrid' ? '#a855f7' : '#10b981';

        const pinIcon = L.divIcon({
          className: 'custom-meeting-pin',
          html: `
            <div style="background:${bgColor}; width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.6);">
              <span style="transform:rotate(45deg); color:#fff; font-size:9px; font-weight:800;">${m.day.slice(0, 3)}</span>
            </div>
          `,
          iconSize: [30, 30],
          iconAnchor: [15, 30],
          popupAnchor: [0, -28]
        });

        const marker = L.marker([m.lat + latOffset, m.lng + lngOffset], { icon: pinIcon }).addTo(markersLayer);

        marker.bindPopup(`
          <div class="space-y-1.5 min-w-[200px]">
            <div class="flex items-center justify-between text-[11px]">
              <span class="font-extrabold text-cyan-400">${m.day} &bull; ${m.time}</span>
              <span class="bg-slate-800 text-slate-200 px-1.5 py-0.5 rounded font-bold">${miles} mi</span>
            </div>
            <div class="font-extrabold text-white text-sm leading-tight">${m.name}</div>
            <div class="text-[11px] text-slate-300 font-medium">${m.locationName}</div>
            <div class="text-[10px] text-slate-400">${m.address}</div>
            <div class="pt-1.5">
              <a href="${dirUrl}" target="_blank" rel="noopener noreferrer"
                style="color:#ffffff !important; text-decoration:none;"
                class="w-full py-2 px-3 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 shadow">
                <i class="ph-bold ph-navigation-arrow"></i> Get Directions
              </a>
            </div>
          </div>
        `);

        markerMap[m.id] = marker;
      });
    }

    function setView(view) {
      state.currentView = view;
      const viewList = document.getElementById('view-list');
      const viewMap = document.getElementById('view-map');
      const tabList = document.getElementById('tab-list');
      const tabMap = document.getElementById('tab-map');

      if (view === 'list') {
        viewList.classList.remove('hidden');
        viewMap.classList.add('hidden');
        tabList.className = 'flex items-center px-3 py-1.5 rounded-lg transition-all bg-cyan-600 text-white shadow-sm';
        tabMap.className = 'flex items-center px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white';
      } else {
        viewList.classList.add('hidden');
        viewMap.classList.remove('hidden');
        tabMap.className = 'flex items-center px-3 py-1.5 rounded-lg transition-all bg-cyan-600 text-white shadow-sm';
        tabList.className = 'flex items-center px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white';

        initMap();
        setTimeout(() => {
          map.invalidateSize();
          updateMapMarkers();
        }, 100);
      }
    }

    window.focusOnMap = function(meetingId) {
      const m = MEETINGS_DATA.find(item => item.id === meetingId);
      if (!m || !m.lat || !m.lng) return;

      setView('map');
      setTimeout(() => {
        map.setView([m.lat, m.lng], 14, { animate: true });
        if (markerMap[meetingId]) {
          markerMap[meetingId].openPopup();
        }
      }, 180);
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderDayPills();
      renderMeetingsList();

      document.getElementById('tab-list').addEventListener('click', () => setView('list'));
      document.getElementById('tab-map').addEventListener('click', () => setView('map'));

      document.getElementById('recenter-home-btn').addEventListener('click', () => {
        if (!map) return;
        map.setView([HOME_LOCATION.lat, HOME_LOCATION.lng], 12, { animate: true });
        if (homeMarker) homeMarker.openPopup();
      });

      document.getElementById('fit-all-btn').addEventListener('click', () => {
        if (!map) return;
        const pts = [[HOME_LOCATION.lat, HOME_LOCATION.lng]];
        MEETINGS_DATA.forEach(m => {
          if (m.lat && m.lng) pts.push([m.lat, m.lng]);
        });
        map.fitBounds(pts, { padding: [45, 45], animate: true });
      });
    });
  </script>
</body>
</html>
